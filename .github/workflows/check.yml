name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The flake declares checks for both platforms, and nd-switch has
        # platform-specific paths (/bin/hostname, the system profile), so a
        # pass on one says nothing about the other.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Flake checks
        run: nix flake check -L

      - name: Module inside real home-manager
        run: nix flake check -L ./tests/hm

      - name: nd-switch against a real nix
        run: bash tests/integration.sh
